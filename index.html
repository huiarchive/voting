<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 투표 웹앱</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F4F7FA;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --bar-bg: #E0E6ED;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 550px;
      padding: 28px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 24px;
      color: #1A2530;
    }

    /* 버튼 영역 Grid (가로 자동 정렬) */
    .vote-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }

    .btn-vote {
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid var(--primary-color);
      background-color: #ffffff;
      color: var(--primary-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-vote:hover {
      background-color: var(--primary-color);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .btn-vote:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* 차트 영역 */
    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .option-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .bar-background {
      width: 100%;
      height: 24px;
      background-color: var(--bar-bg);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 12px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .total-votes {
      text-align: right;
      font-size: 0.85rem;
      color: #666;
      margin-top: 20px;
      font-weight: 500;
    }

    /* 로딩 및 메시지 */
    .loading-status {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      min-height: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 실시간 항목 투표</h1>

    <!-- 1. 투표 버튼 (A안, B안, C안) -->
    <div class="vote-buttons">
      <button class="btn-vote" onclick="castVote('optionA')">A안 투표</button>
      <button class="btn-vote" onclick="castVote('optionB')">B안 투표</button>
      <button class="btn-vote" onclick="castVote('optionC')">C안 투표</button>
    </div>

    <!-- 2. 백분율 막대그래프 (CSS Bar Chart) -->
    <div class="chart-container">
      
      <!-- A안 -->
      <div class="option-item">
        <div class="option-header">
          <span>A안</span>
          <span id="label-optionA">0% (0표)</span>
        </div>
        <div class="bar-background">
          <div id="bar-optionA" class="bar-fill" style="background-color: #4A90E2;"></div>
        </div>
      </div>

      <!-- B안 -->
      <div class="option-item">
        <div class="option-header">
          <span>B안</span>
          <span id="label-optionB">0% (0표)</span>
        </div>
        <div class="bar-background">
          <div id="bar-optionB" class="bar-fill" style="background-color: #34C759;"></div>
        </div>
      </div>

      <!-- C안 -->
      <div class="option-item">
        <div class="option-header">
          <span>C안</span>
          <span id="label-optionC">0% (0표)</span>
        </div>
        <div class="bar-background">
          <div id="bar-optionC" class="bar-fill" style="background-color: #FF9500;"></div>
        </div>
      </div>

    </div>

    <div class="total-votes" id="total-count">총 투표수: 0표</div>
    <div class="loading-status" id="status-text"></div>
  </div>

  <script>
    // ⚠️ [중요] 배포받으신 본인의 GAS 웹앱 URL을 넣으세요!
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxPpS0v2-d18i7iDu5nua4IHqSFKDn4VdJO3StfmAVeCKNBUPydP6xGTvspnj1kon87Sg/exec";

    // 페이지 로드 시 최신 현황 조회
    window.addEventListener('DOMContentLoaded', fetchVotes);

    // 항목 목록 리스트
    const OPTIONS = ['optionA', 'optionB', 'optionC'];

    // 1. 투표 실행
    async function castVote(optionName) {
      setStatus("투표 처리 중...");
      setButtonsDisabled(true);

      try {
        const url = `${GAS_WEBAPP_URL}?action=vote&option=${encodeURIComponent(optionName)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === 'success') {
          updateChartUI(result.data);
          setStatus("투표가 완료되었습니다!");
        } else {
          setStatus("오류가 발생했습니다.");
        }
      } catch (error) {
        console.error("투표 오류:", error);
        setStatus("통신 실패. GAS URL 및 네트워크를 확인해주세요.");
      } finally {
        setButtonsDisabled(false);
      }
    }

    // 2. 전체 데이터 조회
    async function fetchVotes() {
      setStatus("최신 현황 불러오는 중...");
      try {
        const url = `${GAS_WEBAPP_URL}?action=get`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === 'success') {
          updateChartUI(result.data);
          setStatus("");
        }
      } catch (error) {
        console.error("조회 오류:", error);
        setStatus("데이터를 불러오지 못했습니다.");
      }
    }

    // 3. 백분율 및 그래프 갱신
    function updateChartUI(votesData) {
      if (!votesData) return;

      // 전체 투표 수 계산
      let total = 0;
      OPTIONS.forEach(opt => {
        total += Number(votesData[opt] || 0);
      });

      // 각 항목 백분율 계산 및 UI 적용
      OPTIONS.forEach(opt => {
        const count = Number(votesData[opt] || 0);
        const percent = total > 0 ? ((count / total) * 100).toFixed(1) : 0;

        const barElem = document.getElementById(`bar-${opt}`);
        const labelElem = document.getElementById(`label-${opt}`);

        if (barElem) barElem.style.width = `${percent}%`;
        if (labelElem) labelElem.innerText = `${percent}% (${count}표)`;
      });

      document.getElementById('total-count').innerText = `총 투표수: ${total}표`;
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('.btn-vote').forEach(btn => btn.disabled = disabled);
    }

    function setStatus(msg) {
      document.getElementById('status-text').innerText = msg;
    }
  </script>
</body>
</html>
